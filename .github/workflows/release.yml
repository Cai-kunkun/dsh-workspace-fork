name: Release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package (manual run)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the npm package
        id: pack
        run: |
          npm pack
          file="$(ls -1 ./*.tgz | head -n 1)"
          echo "file=$(basename "$file")" >> "$GITHUB_OUTPUT"

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.file }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Attach the package to the tag's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$FILE" --clobber
