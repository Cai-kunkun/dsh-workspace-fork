name: Release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the package
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the npm package
        id: pack
        run: |
          npm pack
          file="$(ls -1 ./*.tgz | head -n 1)"
          echo "file=$(basename "$file")" >> "$GITHUB_OUTPUT"

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.file }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$TAG" "$FILE" --clobber
